const store = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (raw === null) return fallback;
      return JSON.parse(raw);
    } catch (e) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }
};

    for (let i = items.length; i < 12; i++) {
      html += '<div class="empty-cell ' + (language === "en" ? "en" : language === "ja" ? "ja" : "") + '"></div>';
    }
    html += '<div class="row-end"></div>';

  const preset = promptType === "normal" ? templates.normal : templates.zako;
  const years = getVisibleYears();
  const lines = [preset, t("recordNote")];
  years.forEach((year) => {

    if (items.length === 0) return;
    const watched = items.filter((item) => selectedGames.includes(getGameTitle(item, "zh"))).map((item) => getGameTitle(item, language)).join(", ");
    const unWatched = items.filter((item) => !selectedGames.includes(getGameTitle(item, "zh"))).map((item) => getGameTitle(item, language)).join(", ");
    lines.push("**" + year + t("year") + "**:", t("watched") + ": " + (watched || t("none")), t("notWatched") + ": " + (unWatched || t("none")));
  });
  $("promptText").value = lines.filter(Boolean).join("\n");

/* ===================== 表格截图（内嵌 dom→svg-foreignObject→canvas） ===================== */
function tableToBlob(scale) {
  return new Promise((resolve, reject) => {
    try {
      const card = $("tableCard");
      // 克隆并内联 computed style，保证截图样式与页面一致
      const clone = card.cloneNode(true);
      const srcNodes = card.querySelectorAll("*");
      const dstNodes = clone.querySelectorAll("*");
      for (let i = 0; i < srcNodes.length; i++) {
        const cs = window.getComputedStyle(srcNodes[i]);
        const dst = dstNodes[i];
        let inline = "";
        for (let j = 0; j < cs.length; j++) {
          const prop = cs[j];
          inline += prop + ":" + cs.getPropertyValue(prop) + ";";
        }
        dst.setAttribute("style", inline);
        dst.removeAttribute("class");
        dst.removeAttribute("data-key");
      }
      // 移除截图排除项（副标题）
      clone.querySelectorAll(".remove").forEach((el) => el.remove());
      const rect = card.getBoundingClientRect();
      const w = Math.max(1, Math.ceil(rect.width));
      const h = Math.max(1, Math.ceil(rect.height));
      const xml = new XMLSerializer().serializeToString(clone);
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '"><foreignObject width="100%" height="100%">' + xml + "</foreignObject></svg>";
      const img = new Image();
      const canvas = document.createElement("canvas");
      canvas.width = w * scale;
      canvas.height = h * scale;
      img.onload = () => {
        const ctx = canvas.getContext("2d");
        ctx.scale(scale, scale);
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error("toBlob failed"))), "image/png");
      };
      img.onerror = () => reject(new Error("SVG render failed"));
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    } catch (e) {
      reject(e);
    }
  });
}

async function copyImage() {
  try {
    const blob = await tableToBlob(2);
    await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
    alert(t("copySuccess"));
  } catch (e) {
    alert(t("copyFailed", { error: e.message || t("unknownError") }));
  }
}

async function downloadImage() {
  try {
    const blob = await tableToBlob(2);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "game-sedai.png";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  } catch (e) {
    alert(t("downloadFailed", { error: e.message || t("unknownError") }));
  }
}

/* ===================== 事件绑定 ===================== */
$("yearRangeSelect").addEventListener("change", (e) => {
  yearRange = e.currentTarget.value;
  store.set("gameSedaiYearRange", yearRange);
  renderAll();
});

$("langToggle").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-lang]");
  if (!btn) return;
  language = btn.getAttribute("data-lang");
  store.set("gameSedaiLanguage", language);
  renderAll();
});

$("tableBody").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-key]");
  if (!btn) return;
  const key = btn.getAttribute("data-key");
  if (selectedGames.includes(key)) {
    selectedGames = selectedGames.filter((title) => title !== key);
  } else {
    selectedGames = [...selectedGames, key];
  }
  store.set("gameSedaiSelected", selectedGames);
  renderTable();
  renderPrompt();
});

$("selectAllBtn").addEventListener("click", () => {
  const hidden = selectedGames.filter((title) => !visibleKeySet().has(title));
  selectedGames = [...hidden, ...getVisibleGameKeys()];
  store.set("gameSedaiSelected", selectedGames);
  renderTable();
  renderPrompt();
});

$("clearBtn").addEventListener("click", () => {
  const visible = visibleKeySet();
  selectedGames = selectedGames.filter((title) => !visible.has(title));
  store.set("gameSedaiSelected", selectedGames);
  renderTable();
  renderPrompt();
});

$("copyImageBtn").addEventListener("click", copyImage);
$("downloadImageBtn").addEventListener("click", downloadImage);

$("promptTypeSelect").addEventListener("change", (e) => {
  promptType = e.currentTarget.value;
  renderPrompt();
});

$("copyPromptBtn").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText($("promptText").value);
    alert(t("copySuccess"));
  } catch (e) {
    alert(t("copyFailed", { error: e.message || t("unknownError") }));
  }
});

$("chatgptBtn").addEventListener("click", () => {
  window.open("https://chatgpt.com/?q=" + encodeURIComponent($("promptText").value), "_blank");
});

/* ===================== 初始化 ===================== */
$("yearRangeSelect").value = yearRange;
$("promptTypeSelect").value = promptType;
renderAll();
</script>
</body>
</html>
