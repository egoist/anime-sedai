/* ===================== 状态（localStorage 持久化） ===================== */
const store = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (raw === null) return fallback;
      return JSON.parse(raw);
    } catch (e) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }
};

let language = store.get("gameSedaiLanguage", "zh");
let yearRange = store.get("gameSedaiYearRange", "all");
let selectedGames = store.get("gameSedaiSelected", []);
let promptType = "zako";

const $ = (id) => document.getElementById(id);

/* ===================== 渲染 ===================== */
const getVisibleYears = () => {
  if (yearRange === "all") return allYears;
  return allYears.slice(-Number(yearRange));
};

const getVisibleGameKeys = () => {
  return getVisibleYears().flatMap((year) => (gameData[year] || []).slice(0, 12).map((item) => getGameTitle(item, "zh")));
};

const visibleKeySet = () => new Set(getVisibleGameKeys());

function renderLangToggle() {
  const langs = [
    { code: "zh", label: "中文" },
    { code: "en", label: "English" },
    { code: "ja", label: "日本語" }
  ];
  $("langToggle").innerHTML = langs.map((l) =>
    '<button data-lang="' + l.code + '" class="' + (language === l.code ? "active" : "") + '">' + l.label + "</button>"
  ).join("");
}

function t(key, vars) {
  let str = (translations[language] && translations[language][key]) || translations.zh[key] || key;
  if (vars) {
    Object.keys(vars).forEach((k) => { str = str.replace("{{" + k + "}}", vars[k]); });
  }
  return str;
}

function renderStaticText() {
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    el.textContent = t(el.getAttribute("data-i18n"));
  });
  $("titleText").textContent = t("title");
  $("subtitleText").textContent = " - " + t("subtitle");
  $("siteText").textContent = t("website");
  $("selectAllBtn").textContent = t("selectAll");

  $("footerText").innerHTML = t("footer") + ' <a href="https://github.com/egoist/anime-sedai" target="_blank">' + t("footerCredit") + "</a>";

function renderTable() {
  const years = getVisibleYears();
  const keys = getVisibleGameKeys();
  const total = keys.length;
  const selectedVisible = selectedGames.filter((title) => keys.includes(title)).length;
  $("countText").textContent = t("watchedCount", { count: selectedVisible, total });

  const body = $("tableBody");
  let html = "";
  years.forEach((year) => {
    const items = (gameData[year] || []).slice(0, 12);
    html += '<div class="year-row">';
    html += '<div class="year-col"><span>' + year + "</span></div>";
    html += '<div class="cell-row">';
    items.forEach((item) => {
      const key = getGameTitle(item, "zh");
      const displayTitle = getGameTitle(item, language);
      const isSelected = selectedGames.includes(key);
      const cls = ["game-btn", language === "en" ? "en" : language === "ja" ? "ja" : ""].join(" ").trim();
      html += '<button class="' + cls + (isSelected ? " selected" : "") + '" data-key="' + key + '" title="' + displayTitle.replace(/"/g, "&quot;") + '"><span>' + displayTitle + "</span></button>";
    });
    for (let i = items.length; i < 12; i++) {
      html += '<div class="empty-cell ' + (language === "en" ? "en" : language === "ja" ? "ja" : "") + '"></div>';
    }
    html += '<div class="row-end"></div>';
    html += "</div></div>";
  });
  body.innerHTML = html;
  $("clearBtn").style.display = selectedVisible > 0 ? "inline-flex" : "none";

function renderPrompt() {
  const templates = promptTemplates[language] || promptTemplates.zh;
  const preset = promptType === "normal" ? templates.normal : templates.zako;
  const years = getVisibleYears();
  const lines = [preset, t("recordNote")];
  years.forEach((year) => {
    const items = (gameData[year] || []).slice(0, 12);
    if (items.length === 0) return;
    const watched = items.filter((item) => selectedGames.includes(getGameTitle(item, "zh"))).map((item) => getGameTitle(item, language)).join(", ");
    const unWatched = items.filter((item) => !selectedGames.includes(getGameTitle(item, "zh"))).map((item) => getGameTitle(item, language)).join(", ");
    lines.push("**" + year + t("year") + "**:", t("watched") + ": " + (watched || t("none")), t("notWatched") + ": " + (unWatched || t("none")));
  });
  $("promptText").value = lines.filter(Boolean).join("\n");
}

  renderPrompt();

/* ===================== 表格截图（内嵌 dom→svg-foreignObject→canvas） ===================== */
function tableToBlob(scale) {
  return new Promise((resolve, reject) => {
    try {
      const card = $("tableCard");
      // 克隆并内联 computed style，保证截图样式与页面一致
      const clone = card.cloneNode(true);
      const srcNodes = card.querySelectorAll("*");
      const dstNodes = clone.querySelectorAll("*");
      for (let i = 0; i < srcNodes.length; i++) {
        const cs = window.getComputedStyle(srcNodes[i]);
        const dst = dstNodes[i];
        let inline = "";
        for (let j = 0; j < cs.length; j++) {
          const prop = cs[j];
          inline += prop + ":" + cs.getPropertyValue(prop) + ";";
        }
        dst.setAttribute("style", inline);
        dst.removeAttribute("class");
        dst.removeAttribute("data-key");
      }
      // 移除截图排除项（副标题）
      clone.querySelectorAll(".remove").forEach((el) => el.remove());
      const rect = card.getBoundingClientRect();
      const w = Math.max(1, Math.ceil(rect.width));
      const h = Math.max(1, Math.ceil(rect.height));
      const xml = new XMLSerializer().serializeToString(clone);
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '"><foreignObject width="100%" height="100%">' + xml + "</foreignObject></svg>";
      const img = new Image();
      const canvas = document.createElement("canvas");
      canvas.width = w * scale;
      canvas.height = h * scale;
      img.onload = () => {
        const ctx = canvas.getContext("2d");
        ctx.scale(scale, scale);
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error("toBlob failed"))), "image/png");
      };
      img.onerror = () => reject(new Error("SVG render failed"));
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    } catch (e) {
      reject(e);
    }
  });
}

async function copyImage() {
  try {
    const blob = await tableToBlob(2);
    await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
    alert(t("copySuccess"));
  } catch (e) {
    alert(t("copyFailed", { error: e.message || t("unknownError") }));
  }
}

async function downloadImage() {
  try {
    const blob = await tableToBlob(2);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "game-sedai.png";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  } catch (e) {
    alert(t("downloadFailed", { error: e.message || t("unknownError") }));
  }
}

    alert(t("copyFailed", { error: e.message || t("unknownError") }));
  }
});

$("chatgptBtn").addEventListener("click", () => {
  window.open("https://chatgpt.com/?q=" + encodeURIComponent($("promptText").value), "_blank");
});

$("yearRangeSelect").value = yearRange;
$("promptTypeSelect").value = promptType;
renderAll();
</script>
